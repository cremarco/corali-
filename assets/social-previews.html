<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Sorgenti delle anteprime social Coralì</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7e5e4; }
    article { position: relative; width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 520px 680px; background: #020617; color: #fff; }
    .copy { position: relative; z-index: 2; padding: 70px 36px 64px 70px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .logo { width: 275px; height: auto; filter: brightness(0) invert(1); margin-bottom: 52px; }
    h1 { font: 600 58px/1.12 'Playfair Display', Georgia, serif; margin: 0; }
    p { font: 400 27px/1.4 'Hanken Grotesk', sans-serif; margin: 26px 0 0; }
    .photo { width: 100%; height: 630px; object-fit: cover; }
    .wine .photo { object-fit: contain; padding: 30px 50px 30px 0; }
    .wine { grid-template-columns: 620px 580px; }
  </style>
</head>
<body>
  <article id="home">
    <div class="copy">
      <img class="logo" src="../img/logo/scritta-corali.svg" alt="Coralì">
      <h1>Cucina di mare<br>a Varazze</h1>
      <p>coralivarazze.it</p>
    </div>
    <img class="photo" src="../img/photo/room/sala-prospettiva-volta-pro.webp" alt="La sala di Coralì">
  </article>
  <article id="menu">
    <div class="copy">
      <img class="logo" src="../img/logo/scritta-corali.svg" alt="Coralì">
      <h1>Menu<br>e prezzi</h1>
      <p>Cucina di mare · Varazze</p>
    </div>
    <img class="photo" src="../img/photo/plates/piatto-mare-sala.webp" alt="Un piatto di mare di Coralì">
  </article>
  <article id="vini" class="wine">
    <div class="copy">
      <img class="logo" src="../img/logo/scritta-corali.svg" alt="Coralì">
      <h1>La carta<br>dei vini</h1>
      <p>79 referenze · Varazze</p>
    </div>
    <img class="photo" src="../img/photo/hero/hero-wine-selection.webp" alt="Calici di vino sulla tavola di Coralì">
  </article>
  <article id="galleria">
    <div class="copy">
      <img class="logo" src="../img/logo/scritta-corali.svg" alt="Coralì">
      <h1>I nostri<br>piatti</h1>
      <p>La galleria di Coralì</p>
    </div>
    <img class="photo" src="../img/photo/plates/crudi-mare-conserve-pane.webp" alt="Crudi di mare preparati da Coralì">
  </article>
</body>
</html>
